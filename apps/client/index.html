<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/kuts.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Headquarters</title>
</head>
<body class="overflow-y-hidden">
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
<script>
    // Швидка перевірка localStorage до завантаження React
    try {
        const themeStorage = JSON.parse(localStorage.getItem('theme-storage'));
        if (themeStorage?.state?.isDarkMode) {
            document.documentElement.classList.add('dark');
        }
    } catch (e) {}
</script>
</body>
</html>
